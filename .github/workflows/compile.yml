name: compile examples

on:
  push:
  pull_request:

jobs:
  atmega328pb:
    name: ATmega328PB (flight board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: MiniCore:avr:328:variant=modelPB,clock=16MHz_external
          platforms: |
            - name: MiniCore:avr
              source-url: https://mcudude.github.io/MiniCore/package_MCUdude_MiniCore_index.json
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples
          verbose: false

  esp32:
    name: ESP32 (bench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples
          verbose: false
